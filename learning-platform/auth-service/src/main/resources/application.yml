server:
  port: 8081

spring:
  application:
    name: auth-service
  # Default: file-based H2 (no install needed, data kept in ./data).
  # Run with --spring.profiles.active=mysql to use MySQL instead.
  datasource:
    url: jdbc:h2:file:./data/authdb;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

app:
  jwt:
    # MUST be identical in lecture-service. At least 32 characters.
    secret: ${JWT_SECRET:change-this-secret-key-to-something-long-and-random-1234567890}
    expiration-seconds: 86400

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

---
---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
