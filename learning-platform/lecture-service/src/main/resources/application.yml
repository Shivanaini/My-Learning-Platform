server:
  port: 8082

spring:
  application:
    name: lecture-service
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  # Default: file-based H2 (no install needed, data kept in ./data).
  # Run with --spring.profiles.active=mysql to use MySQL instead.
  datasource:
    url: jdbc:h2:file:./data/lecturedb;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  storage:
    # Folder where uploaded lecture files are saved
    location: ${STORAGE_LOCATION:./uploads}
  jwt:
    # MUST be identical to auth-service
    secret: ${JWT_SECRET:change-this-secret-key-to-something-long-and-random-1234567890}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

---
---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
